# Google Python Style Guide: 80 columns, 4-space indents, Google docstrings.
line-length = 80
indent-width = 4
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"**/tests/**" = ["D"]

[lint.isort]
known-first-party = ["ofod", "ofod_cpp"]
force-sort-within-sections = true
