site_name: OFOD 11 code companion
site_description: >-
  C++20 and Python code for Hull's Options, Futures and Other Derivatives,
  11th edition, one page per chapter.
repo_url: https://github.com/dzheresc/ofod11
edit_uri: ""
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

# The chapter and API pages and the nav are generated from the chapter
# READMEs and the ofod package by docs/hooks/chapters.py.
hooks:
  - docs/hooks/chapters.py

exclude_docs: |
  hooks/
  perf/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            filters: ["!^_"]
